<!DOCTYPE html>
<html lang="en" class="bg-gray-950 text-gray-200 font-sans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel — Firmware Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <style>
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
        .dag-node { transition: all 0.3s ease; }
        .dag-active { @apply bg-blue-600 text-white shadow-lg shadow-blue-500/50 scale-110; }
        .dag-done { @apply bg-green-700 text-green-100; }
        .dag-fail { @apply bg-red-700 text-red-100; }
        .dag-skip { @apply bg-gray-700 text-gray-400; }
        .finding-card { transition: all 0.2s ease; }
        .finding-card:hover { @apply border-gray-600; }
        .proof-block { @apply bg-black/50 border border-gray-800 rounded p-3 mono text-xs overflow-x-auto; }
        .pulse-dot { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="p-6 max-w-7xl mx-auto" x-data="sentinelApp()">

    <!-- Header -->
    <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
        <div>
            <h1 class="text-3xl font-bold text-white">Sentinel <span class="text-blue-500">Firmware Lane</span></h1>
            <p class="text-gray-500 mono text-sm mt-1">
                Status: <span class="text-gray-300" x-text="status"></span>
            </p>
        </div>
        <button @click="showScanForm = !showScanForm" 
                class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded font-medium transition">
            New Scan
        </button>
    </header>

    <!-- Scan Form Modal -->
    <div x-show="showScanForm" x-transition class="fixed inset-0 bg-black/70 flex items-center justify-center z-50" @click.self="showScanForm = false">
        <div class="bg-gray-900 rounded-lg p-6 max-w-2xl w-full mx-4 border border-gray-700">
            <h2 class="text-xl font-bold text-white mb-4">Start New Firmware Scan</h2>
            <form @submit.prevent="startScan">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Firmware Image Path</label>
                        <input type="text" x-model="scanForm.imagePath" required
                               class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded text-white mono text-sm"
                               placeholder="/path/to/firmware.bin">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Authorization Reference</label>
                        <input type="text" x-model="scanForm.scopeRef" required
                               class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded text-white mono text-sm"
                               placeholder="LOCAL-TEST-001">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Firmware SHA256 (optional, for scope validation)</label>
                        <input type="text" x-model="scanForm.firmwareSha256"
                               class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded text-white mono text-sm"
                               placeholder="Leave empty to scan any image">
                    </div>
                </div>
                <div class="flex gap-3 mt-6">
                    <button type="submit" :disabled="scanning"
                            class="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-700 rounded font-medium transition">
                        <span x-show="!scanning">Start Scan</span>
                        <span x-show="scanning">Scanning...</span>
                    </button>
                    <button type="button" @click="showScanForm = false"
                            class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded font-medium transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Pipeline DAG -->
    <section class="mb-8">
        <h2 class="text-xl font-semibold mb-4 text-gray-300">Pipeline Checkpoints</h2>
        <div class="flex flex-wrap gap-3">
            <template x-for="stage in stages" :key="stage">
                <div class="dag-node px-4 py-2 rounded-lg border border-gray-700 bg-gray-800 text-sm font-medium"
                     :class="{
                        'dag-active': activeStage === stage,
                        'dag-done': checkpoints[stage] === 'done',
                        'dag-fail': checkpoints[stage] === 'fail',
                        'dag-skip': checkpoints[stage] === 'skip'
                     }">
                    <span x-text="stage"></span>
                    <span x-show="checkpoints[stage] === 'done'" class="ml-2">✓</span>
                    <span x-show="checkpoints[stage] === 'fail'" class="ml-2">✗</span>
                    <span x-show="checkpoints[stage] === 'skip'" class="ml-2">⊘</span>
                    <span x-show="activeStage === stage" class="ml-2 pulse-dot">●</span>
                </div>
            </template>
        </div>
    </section>

    <!-- Findings Triage -->
    <section class="mb-8">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold text-gray-300">
                Findings <span class="text-gray-500 text-sm" x-text="`(${filteredFindings.length}/${findings.length})`"></span>
            </h2>
            <div class="flex gap-2">
                <button @click="filter = 'all'" 
                        :class="filter === 'all' ? 'bg-blue-600' : 'bg-gray-800'" 
                        class="px-3 py-1 rounded text-sm hover:bg-blue-700 transition">
                    All
                </button>
                <button @click="filter = 'confirmed'" 
                        :class="filter === 'confirmed' ? 'bg-red-600' : 'bg-gray-800'" 
                        class="px-3 py-1 rounded text-sm hover:bg-red-700 transition">
                    Confirmed
                </button>
                <button @click="filter = 'probable'" 
                        :class="filter === 'probable' ? 'bg-yellow-600' : 'bg-gray-800'" 
                        class="px-3 py-1 rounded text-sm hover:bg-yellow-700 transition">
                    Probable
                </button>
                <button @click="filter = 'candidate'" 
                        :class="filter === 'candidate' ? 'bg-gray-600' : 'bg-gray-800'" 
                        class="px-3 py-1 rounded text-sm hover:bg-gray-700 transition">
                    Candidate
                </button>
            </div>
        </div>

        <div class="space-y-3">
            <template x-for="f in filteredFindings" :key="f.id">
                <div class="finding-card bg-gray-900 border border-gray-800 rounded-lg p-4" 
                     @click="f.expanded = !f.expanded">
                    <div class="flex justify-between items-start cursor-pointer">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="px-2 py-0.5 rounded text-xs font-bold" 
                                      :class="{
                                          'bg-red-900 text-red-200': f.confidence === 'confirmed',
                                          'bg-yellow-900 text-yellow-200': f.confidence === 'probable',
                                          'bg-gray-700 text-gray-300': f.confidence === 'candidate'
                                      }" 
                                      x-text="f.confidence"></span>
                                <span class="px-2 py-0.5 rounded text-xs font-medium bg-blue-900/50 text-blue-200" 
                                      x-text="f.axis"></span>
                                <span class="px-2 py-0.5 rounded text-xs font-medium" 
                                      :class="{
                                          'bg-red-800 text-red-100': f.severity === 'critical',
                                          'bg-orange-800 text-orange-100': f.severity === 'high',
                                          'bg-yellow-800 text-yellow-100': f.severity === 'medium',
                                          'bg-blue-800 text-blue-100': f.severity === 'low',
                                          'bg-gray-700 text-gray-300': f.severity === 'info'
                                      }" 
                                      x-text="f.severity"></span>
                            </div>
                            <h3 class="font-semibold text-white" x-text="f.title"></h3>
                            <p class="text-gray-400 text-sm mt-2" x-text="f.summary"></p>
                        </div>
                        <div class="text-right ml-4">
                            <span class="mono text-xs text-gray-500" x-text="f.target"></span>
                            <div class="text-gray-600 text-xs mt-1" x-text="f.expanded ? '▲ Collapse' : '▼ Expand'"></div>
                        </div>
                    </div>
                    
                    <!-- Expanded Details -->
                    <div x-show="f.expanded" class="mt-4 space-y-3" @click.stop>
                        <div x-show="f.context && Object.keys(f.context).length > 0">
                            <h4 class="text-sm font-semibold text-gray-400 mb-2">Context</h4>
                            <pre class="proof-block" x-text="JSON.stringify(f.context, null, 2)"></pre>
                        </div>
                        
                        <div x-show="f.proof">
                            <h4 class="text-sm font-semibold text-gray-400 mb-2">
                                <span class="text-green-500">[VERIFIER]</span> Proof Artifact
                            </h4>
                            <div class="proof-block">
                                <div class="mb-2">
                                    <span class="text-gray-500">Kind:</span> 
                                    <span class="text-gray-300" x-text="f.proof.kind"></span>
                                </div>
                                <details class="mt-2">
                                    <summary class="cursor-pointer text-gray-500 hover:text-gray-300">
                                        Claim Details
                                    </summary>
                                    <pre class="mt-2 text-gray-400" x-text="JSON.stringify(f.proof.claim, null, 2)"></pre>
                                </details>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
            
            <div x-show="filteredFindings.length === 0" class="text-center text-gray-600 py-10">
                No findings match the current filter.
            </div>
        </div>
    </section>

    <!-- Completed Runs -->
    <section>
        <h2 class="text-xl font-semibold mb-4 text-gray-300">Completed Runs</h2>
        <div class="space-y-2">
            <template x-for="run in runs" :key="run.run_id">
                <div class="bg-gray-900 border border-gray-800 rounded-lg p-4 hover:border-gray-600 transition cursor-pointer"
                     @click="loadReport(run.run_id)">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="font-medium text-white" x-text="run.run_id"></span>
                            <span class="text-gray-500 text-sm ml-3" x-text="run.authorization"></span>
                        </div>
                        <div class="text-right">
                            <div class="text-gray-400 text-sm">
                                <span x-text="run.findings_count"></span> findings
                            </div>
                            <div class="text-gray-600 text-xs mono" x-text="new Date(run.timestamp * 1000).toLocaleString()"></div>
                        </div>
                    </div>
                </div>
            </template>
            <div x-show="runs.length === 0" class="text-center text-gray-600 py-10">
                No completed runs yet.
            </div>
        </div>
    </section>

    <script>
        function sentinelApp() {
            return {
                status: 'idle',
                activeStage: '',
                checkpoints: {},
                findings: [],
                filter: 'all',
                runs: [],
                showScanForm: false,
                scanning: false,
                scanForm: {
                    imagePath: '',
                    scopeRef: 'LOCAL-TEST',
                    firmwareSha256: ''
                },
                stages: [
                    'acquire', 'unpack', 'rootfs', 'services', 'secrets', 
                    'backdoor', 'binanalysis', 'elfscan', 'emulate', 
                    'reachability', 'webscan', 'triage', 'report'
                ],
                
                get filteredFindings() {
                    if (this.filter === 'all') return this.findings;
                    return this.findings.filter(f => f.confidence === this.filter);
                },

                init() {
                    this.connectSSE();
                    this.loadRuns();
                },

                connectSSE() {
                    const evtSource = new EventSource('/sse');
                    evtSource.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        this.handleSSEEvent(data);
                    };
                    evtSource.onerror = () => {
                        console.log('SSE connection lost, reconnecting...');
                        setTimeout(() => this.connectSSE(), 3000);
                    };
                },

                handleSSEEvent(data) {
                    if (data.type === 'checkpoint.state') {
                        const state = data.state;
                        if (state === 'running') {
                            this.activeStage = data.id;
                            this.status = 'scanning';
                        } else if (state === 'ok' || state === 'cached') {
                            this.checkpoints[data.id] = 'done';
                            this.activeStage = '';
                        } else if (state === 'failed') {
                            this.checkpoints[data.id] = 'fail';
                            this.activeStage = '';
                        } else if (state === 'skipped') {
                            this.checkpoints[data.id] = 'skip';
                        }
                    } else if (data.type === 'finding') {
                        const finding = {
                            ...data,
                            expanded: false
                        };
                        this.findings.push(finding);
                    } else if (data.type === 'run.complete') {
                        this.status = 'completed';
                        this.activeStage = '';
                        this.scanning = false;
                        this.showScanForm = false;
                        this.loadRuns();
                    } else if (data.type === 'run.error') {
                        this.status = 'failed';
                        this.scanning = false;
                        alert('Scan failed: ' + data.error);
                    }
                },

                async startScan() {
                    this.scanning = true;
                    this.status = 'starting';
                    this.findings = [];
                    this.checkpoints = {};
                    this.activeStage = '';
                    
                    try {
                        const response = await fetch('/api/scan', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                image_path: this.scanForm.imagePath,
                                scope_ref: this.scanForm.scopeRef,
                                firmware_sha256: this.scanForm.firmwareSha256 ? [this.scanForm.firmwareSha256] : null
                            })
                        });
                        
                        if (!response.ok) {
                            throw new Error('Failed to start scan');
                        }
                        
                        const result = await response.json();
                        console.log('Scan started:', result);
                    } catch (error) {
                        this.scanning = false;
                        this.status = 'error';
                        alert('Error starting scan: ' + error.message);
                    }
                },

                async loadRuns() {
                    try {
                        const response = await fetch('/api/runs');
                        this.runs = await response.json();
                    } catch (error) {
                        console.error('Failed to load runs:', error);
                    }
                },

                async loadReport(runId) {
                    try {
                        const response = await fetch(`/runs/${runId}/report.json`);
                        const report = await response.json();
                        this.findings = report.findings.map(f => ({
                            ...f,
                            expanded: false
                        }));
                        this.status = `viewing ${runId}`;
                    } catch (error) {
                        alert('Failed to load report: ' + error.message);
                    }
                }
            }
        }
    </script>
</body>
</html>
